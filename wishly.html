  <body className="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { createRoot } = ReactDOM
      const { useState, useEffect, useRef } = React

      const App = () => {
        // State management
        const [items, setItems] = useState([])
        const [newItem, setNewItem] = useState({
          name: "",
          price: "",
          currency: "USD",
          category: "clothing",
          brand: "",
          link: "",
          notes: "",
          imageUrl: "",
          tags: [],
          condition: "new",
        })

        // Personal dimensions state
        const [dimensions, setDimensions] = useState({
          height: { value: 170, unit: "cm" },
          weight: { value: 70, unit: "kg" },
          shoeSize: { value: 42, unit: "EU" },
          footLength: { value: 26, unit: "cm" },
          footWidth: { value: 9, unit: "cm" },
          inseam: { value: 81, unit: "cm" },
          waist: { value: 82, unit: "cm" },
          chest: { value: 94, unit: "cm" },
          shoulderWidth: { value: 42, unit: "cm" },
          sleeveLength: { value: 58, unit: "cm" },
        })

        // Currency and conversion state
        const [exchangeRates, setExchangeRates] = useState({})
        const [baseCurrency, setBaseCurrency] = useState("USD")
        const [targetCurrency, setTargetCurrency] = useState("USD")
        const [conversionRate, setConversionRate] = useState(1)
        const [currencies] = useState(["USD", "EUR", "GBP", "JPY", "CAD", "AUD", "CHF", "CNY", "SEK", "NOK", "DKK"])

        // Body measurement state
        const [bodyPartNotes, setBodyPartNotes] = useState({})
        const [measurementNodes, setMeasurementNodes] = useState([])
        const [draggedNode, setDraggedNode] = useState(null)
        const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 })
        const [selectedBodyPart, setSelectedBodyPart] = useState(null)
        const [showBodyPartModal, setShowBodyPartModal] = useState(false)
        const [editingNode, setEditingNode] = useState(null)

        // Additional UI state
        const [isEditing, setIsEditing] = useState(false)
        const [editId, setEditId] = useState(null)
        const [showModal, setShowModal] = useState(false)
        const [newCategoryName, setNewCategoryName] = useState("")
        const [newCategoryIcon, setNewCategoryIcon] = useState("tag")
        const [editingNodeLabel, setEditingNodeLabel] = useState("")
        const [showEditNodeModal, setShowEditNodeModal] = useState(false)

        // Iframe modal state
        const [showIframeModal, setShowIframeModal] = useState(false)
        const [iframeUrl, setIframeUrl] = useState("")
        const [iframeTitle, setIframeTitle] = useState("")

        // Measurement canvas state
        const [measurementEditMode, setMeasurementEditMode] = useState(false)
        const [showBackgroundSettings, setShowBackgroundSettings] = useState(false)

        // Settings state - consolidated for localStorage
        const [settings, setSettings] = useState({
          lastActiveTab: "items",
          measurementEditMode: false,
          backgroundImageUrl: "",
          backgroundPositionX: 50,
          backgroundPositionY: 50,
          backgroundSize: "cover",
          darkMode: false,
          baseCurrency: "USD",
          targetCurrency: "USD",
          viewMode: "grid",
          sortBy: "newest",
          selectedBrand: "all",
          selectedTags: [],
          activeCategoryView: "all",
          searchTerm: "",
        })

        // Refs
        const fileInputRef = useRef(null)

        // UI state
        const [activeTab, setActiveTab] = useState("items")
        const [searchTerm, setSearchTerm] = useState("")
        const [activeCategoryView, setActiveCategoryView] = useState("all")
        const [showAddModal, setShowAddModal] = useState(false)
        const [showCategoryModal, setShowCategoryModal] = useState(false)
        const [notification, setNotification] = useState(null)
        const [isLoading, setIsLoading] = useState(false)

        // Enhanced filtering and tagging state
        const [selectedTags, setSelectedTags] = useState([])
        const [allTags, setAllTags] = useState([])
        const [selectedBrand, setSelectedBrand] = useState("all")
        const [allBrands, setAllBrands] = useState([])
        const [sortBy, setSortBy] = useState("newest")
        const [viewMode, setViewMode] = useState("grid") // grid or list
        const [selectedItems, setSelectedItems] = useState([])

        // Comparison state
        const [comparisonItems, setComparisonItems] = useState([])
        const [showComparison, setShowComparison] = useState(false)

        // Dark mode state
        const [darkMode, setDarkMode] = useState(false)

        // Category definitions
        const [categories, setCategories] = useState([
          { id: "clothing", name: "Clothing", icon: "tshirt" },
          { id: "tech", name: "Technology", icon: "laptop" },
          { id: "home", name: "Home", icon: "home" },
          { id: "accessories", name: "Accessories", icon: "gem" },
          { id: "books", name: "Books", icon: "book" },
          { id: "other", name: "Other", icon: "ellipsis-h" },
        ])

        // Currency to country mapping for flags
        const currencyToCountry = {
          USD: "US",
          EUR: "DE",
          GBP: "GB",
          JPY: "JP",
          CAD: "CA",
          AUD: "AU",
          CHF: "CH",
          CNY: "CN",
          SEK: "SE",
          NOK: "NO",
          DKK: "DK",
        }

        // Item conditions
        const itemConditions = [
          { id: "new", name: "New", icon: "fas fa-star" },
          { id: "like-new", name: "Like New", icon: "fas fa-star-half-alt" },
          { id: "used-good", name: "Used - Good", icon: "fas fa-thumbs-up" },
          { id: "used-fair", name: "Used - Fair", icon: "fas fa-minus-circle" },
          { id: "vintage", name: "Vintage", icon: "fas fa-clock" },
        ]

        // Sort options
        const sortOptions = [
          { id: "newest", name: "Newest First", icon: "fas fa-calendar-plus" },
          { id: "oldest", name: "Oldest First", icon: "fas fa-calendar-minus" },
          { id: "price-high", name: "Price High to Low", icon: "fas fa-sort-amount-down" },
          { id: "price-low", name: "Price Low to High", icon: "fas fa-sort-amount-up" },
          { id: "priority", name: "Priority", icon: "fas fa-exclamation-triangle" },
          { id: "name", name: "Name A-Z", icon: "fas fa-sort-alpha-down" },
        ]

        // Get flag URL for currency
        const getFlagUrl = (currency) => {
          const countryCode = currencyToCountry[currency]
          return countryCode ? `https://flagsapi.com/${countryCode}/flat/24.png` : null
        }

        // Load data from localStorage
        useEffect(() => {
          const savedItems = localStorage.getItem("shoppingItems")
          if (savedItems) setItems(JSON.parse(savedItems))

          const savedDimensions = localStorage.getItem("personalDimensions")
          if (savedDimensions) setDimensions(JSON.parse(savedDimensions))

          const savedCategories = localStorage.getItem("shoppingCategories")
          if (savedCategories) setCategories(JSON.parse(savedCategories))

          const savedBodyPartNotes = localStorage.getItem("bodyPartNotes")
          if (savedBodyPartNotes) setBodyPartNotes(JSON.parse(savedBodyPartNotes))

          const savedMeasurementNodes = localStorage.getItem("measurementNodes")
          if (savedMeasurementNodes) setMeasurementNodes(JSON.parse(savedMeasurementNodes))

          const savedSettings = localStorage.getItem("appSettings")
          if (savedSettings) {
            const parsedSettings = JSON.parse(savedSettings)
            console.log("Loading settings from localStorage:", parsedSettings)
            setSettings(parsedSettings)

            // Apply loaded settings to individual state variables
            setActiveTab(parsedSettings.lastActiveTab || "items")
            setMeasurementEditMode(parsedSettings.measurementEditMode || false)
            setDarkMode(parsedSettings.darkMode || false)
            setBaseCurrency(parsedSettings.baseCurrency || "USD")
            setTargetCurrency(parsedSettings.targetCurrency || "USD")
            setViewMode(parsedSettings.viewMode || "grid")
            setSortBy(parsedSettings.sortBy || "newest")
            setSelectedBrand(parsedSettings.selectedBrand || "all")
            setSelectedTags(parsedSettings.selectedTags || [])
            setActiveCategoryView(parsedSettings.activeCategoryView || "all")
            setSearchTerm(parsedSettings.searchTerm || "")

            // Restore background settings - ensure they exist in settings state
            setSettings(prev => ({
              ...prev,
              backgroundImageUrl: parsedSettings.backgroundImageUrl || "",
              backgroundPositionX: parsedSettings.backgroundPositionX || 50,
              backgroundPositionY: parsedSettings.backgroundPositionY || 50,
              backgroundSize: parsedSettings.backgroundSize || "cover"
            }))
          }

          // Legacy support - remove individual localStorage items if they exist
          const legacyDarkMode = localStorage.getItem("darkMode")
          const legacyBaseCurrency = localStorage.getItem("baseCurrency")
          const legacyTargetCurrency = localStorage.getItem("targetCurrency")

          if (legacyDarkMode && !savedSettings) setDarkMode(JSON.parse(legacyDarkMode))
          if (legacyBaseCurrency && !savedSettings) setBaseCurrency(legacyBaseCurrency)
          if (legacyTargetCurrency && !savedSettings) setTargetCurrency(legacyTargetCurrency)

          fetchExchangeRates()
        }, [])

        // Save to localStorage when data changes
        useEffect(() => localStorage.setItem("shoppingItems", JSON.stringify(items)), [items])
        useEffect(() => localStorage.setItem("personalDimensions", JSON.stringify(dimensions)), [dimensions])
        useEffect(() => localStorage.setItem("shoppingCategories", JSON.stringify(categories)), [categories])
        useEffect(() => localStorage.setItem("bodyPartNotes", JSON.stringify(bodyPartNotes)), [bodyPartNotes])
        useEffect(() => localStorage.setItem("measurementNodes", JSON.stringify(measurementNodes)), [measurementNodes])

        // Comprehensive settings saving
        useEffect(() => {
          const settingsToSave = {
            lastActiveTab: activeTab,
            measurementEditMode,
            backgroundImageUrl: settings.backgroundImageUrl || "",
            backgroundPositionX: settings.backgroundPositionX || 50,
            backgroundPositionY: settings.backgroundPositionY || 50,
            backgroundSize: settings.backgroundSize || "cover",
            darkMode,
            baseCurrency,
            targetCurrency,
            viewMode,
            sortBy,
            selectedBrand,
            selectedTags,
            activeCategoryView,
            searchTerm,
          }
          console.log("Saving comprehensive settings to localStorage:", settingsToSave)
          localStorage.setItem("appSettings", JSON.stringify(settingsToSave))

          // Clean up legacy localStorage items
          localStorage.removeItem("darkMode")
          localStorage.removeItem("baseCurrency")
          localStorage.removeItem("targetCurrency")
        }, [
          activeTab,
          measurementEditMode,
          settings.backgroundImageUrl,
          settings.backgroundPositionX,
          settings.backgroundPositionY,
          settings.backgroundSize,
          darkMode,
          baseCurrency,
          targetCurrency,
          viewMode,
          sortBy,
          selectedBrand,
          selectedTags,
          activeCategoryView,
          searchTerm,
        ])

        // Fetch exchange rates
        const fetchExchangeRates = async () => {
          try {
            const response = await fetch(`https://api.exchangerate-api.com/v4/latest/${baseCurrency}`)
            const data = await response.json()
            setExchangeRates(data.rates)
          } catch (error) {
            console.error("Failed to fetch exchange rates:", error)
          }
        }

        // Currency conversion functions
        const convertPrice = (price, fromCurrency) => {
          if (fromCurrency === baseCurrency) {
            return price * conversionRate
          } else if (exchangeRates[fromCurrency]) {
            return (price / exchangeRates[fromCurrency]) * conversionRate
          }
          return price
        }

        const formatCurrency = (value, currency) => {
          return new Intl.NumberFormat(undefined, {
            style: "currency",
            currency: currency,
          }).format(value)
        }

        // Update conversion rate when target currency changes
        useEffect(() => {
          if (targetCurrency === baseCurrency) {
            setConversionRate(1)
          } else if (exchangeRates[targetCurrency]) {
            setConversionRate(exchangeRates[targetCurrency])
          }
        }, [targetCurrency, baseCurrency, exchangeRates])

        // Extract all tags from items
        useEffect(() => {
          const tags = new Set()
          items.forEach(item => {
            if (item.tags && Array.isArray(item.tags)) {
              item.tags.forEach(tag => tags.add(tag))
            }
          })
          setAllTags(Array.from(tags).sort())
        }, [items])

        // Extract all brands from items
        useEffect(() => {
          const brands = new Set()
          items.forEach(item => {
            if (item.brand && item.brand.trim()) {
              brands.add(item.brand.trim())
            }
          })
          setAllBrands(Array.from(brands).sort())
        }, [items])

        // Enhanced filtering and sorting functions
        const getPriorityOrder = (priority) => {
          const order = { high: 3, medium: 2, low: 1, wishlist: 0 }
          return order[priority] || 0
        }

        const sortItems = (items, sortBy) => {
          return [...items].sort((a, b) => {
            switch (sortBy) {
              case "newest":
                return new Date(b.addedDate || 0) - new Date(a.addedDate || 0)
              case "oldest":
                return new Date(a.addedDate || 0) - new Date(b.addedDate || 0)
              case "price-high":
                const priceA = parseFloat(a.price) || 0
                const priceB = parseFloat(b.price) || 0
                return priceB - priceA
              case "price-low":
                const priceA2 = parseFloat(a.price) || 0
                const priceB2 = parseFloat(b.price) || 0
                return priceA2 - priceB2
              case "priority":
                return getPriorityOrder(b.priority || "medium") - getPriorityOrder(a.priority || "medium")
              case "name":
                return a.name.localeCompare(b.name)
              default:
                return 0
            }
          })
        }

        const filterItems = (items) => {
          return items.filter((item) => {
            // Search term filter
            const matchesSearch =
              item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
              item.notes.toLowerCase().includes(searchTerm.toLowerCase()) ||
              (item.brand && item.brand.toLowerCase().includes(searchTerm.toLowerCase())) ||
              (item.tags && item.tags.some(tag => tag.toLowerCase().includes(searchTerm.toLowerCase())))

            // Category filter
            const matchesCategory = activeCategoryView === "all" || item.category === activeCategoryView

            // Tags filter
            const matchesTags = selectedTags.length === 0 ||
              (item.tags && selectedTags.every(tag => item.tags.includes(tag)))

            // Brand filter
            const matchesBrand = selectedBrand === "all" || item.brand === selectedBrand

            return matchesSearch && matchesCategory && matchesTags && matchesBrand
          })
        }

        // Tag management functions
        const addTagToItem = (itemId, tag) => {
          setItems(prev => prev.map(item => {
            if (item.id === itemId) {
              const tags = item.tags || []
              if (!tags.includes(tag)) {
                return { ...item, tags: [...tags, tag] }
              }
            }
            return item
          }))
        }

        const removeTagFromItem = (itemId, tag) => {
          setItems(prev => prev.map(item => {
            if (item.id === itemId && item.tags) {
              return { ...item, tags: item.tags.filter(t => t !== tag) }
            }
            return item
          }))
        }

        // Bulk operations
        const handleSelectItem = (itemId) => {
          setSelectedItems(prev =>
            prev.includes(itemId)
              ? prev.filter(id => id !== itemId)
              : [...prev, itemId]
          )
        }

        const handleSelectAll = () => {
          const filteredItemIds = filteredItems.map(item => item.id)
          setSelectedItems(
            selectedItems.length === filteredItemIds.length ? [] : filteredItemIds
          )
        }

        const bulkDeleteItems = () => {
          setItems(prev => prev.filter(item => !selectedItems.includes(item.id)))
          setSelectedItems([])
          setNotification({ type: "success", message: `Deleted ${selectedItems.length} items` })
        }

        const bulkUpdateCategory = (newCategory) => {
          setItems(prev => prev.map(item =>
            selectedItems.includes(item.id) ? { ...item, category: newCategory } : item
          ))
          setSelectedItems([])
          setNotification({ type: "success", message: `Updated ${selectedItems.length} items` })
        }

        // Comparison functions
        const addToComparison = (item) => {
          if (comparisonItems.length < 4 && !comparisonItems.find(i => i.id === item.id)) {
            setComparisonItems([...comparisonItems, item])
            setNotification({ type: "success", message: "Added to comparison" })
          }
        }

        const removeFromComparison = (itemId) => {
          setComparisonItems(prev => prev.filter(item => item.id !== itemId))
        }

        // Export data functionality
        const exportData = () => {
          try {
            const comprehensiveData = {
              // Core data
              items,
              dimensions,
              categories,
              bodyPartNotes,
              measurementNodes,

              // All settings (consolidated)
              settings: {
                lastActiveTab: activeTab,
                measurementEditMode,
                backgroundImageUrl: settings.backgroundImageUrl,
                backgroundPositionX: settings.backgroundPositionX,
                backgroundPositionY: settings.backgroundPositionY,
                backgroundSize: settings.backgroundSize,
                darkMode,
                baseCurrency,
                targetCurrency,
                viewMode,
                sortBy,
                selectedBrand,
                selectedTags,
                activeCategoryView,
                searchTerm,
              },

              // UI state (for complete restoration)
              uiState: {
                allTags,
                comparisonItems,
                exchangeRates,
              },

              // Metadata
              exportMetadata: {
                timestamp: new Date().toISOString(),
                version: "3.0",
                totalItems: items.length,
                totalCategories: categories.length,
                totalMeasurementNodes: measurementNodes.length,
                appName: "Wishly",
              }
            }

            const blob = new Blob([JSON.stringify(comprehensiveData, null, 2)], { type: "application/json" })
            const url = URL.createObjectURL(blob)
            const a = document.createElement("a")
            a.href = url
            a.download = `wishly-complete-export-${new Date().toISOString().slice(0, 10)}.json`
            document.body.appendChild(a)
            a.click()
            document.body.removeChild(a)
            URL.revokeObjectURL(url)

            setNotification({
              type: "success",
              message: `Complete data exported! (${items.length} items, ${categories.length} categories)`
            })
          } catch (error) {
            console.error("Export error:", error)
            setNotification({ type: "error", message: "Failed to export data" })
          }
        }

        // Import data functionality
        const importData = (e) => {
          const file = e.target.files[0]
          if (!file) return

          const reader = new FileReader()
          reader.onload = (event) => {
            try {
              const data = JSON.parse(event.target.result)
              console.log("Importing data:", data)

              // Import core data
              if (data.items) {
                setItems(data.items)
                console.log(`Imported ${data.items.length} items`)
              }
              if (data.dimensions) setDimensions(data.dimensions)
              if (data.categories) setCategories(data.categories)
              if (data.bodyPartNotes) setBodyPartNotes(data.bodyPartNotes)
              if (data.measurementNodes) setMeasurementNodes(data.measurementNodes)

              // Import comprehensive settings
              if (data.settings) {
                const importedSettings = data.settings
                setSettings(importedSettings)

                // Apply all settings to state variables
                if (importedSettings.lastActiveTab) setActiveTab(importedSettings.lastActiveTab)
                if (importedSettings.measurementEditMode !== undefined) setMeasurementEditMode(importedSettings.measurementEditMode)
                if (importedSettings.darkMode !== undefined) setDarkMode(importedSettings.darkMode)
                if (importedSettings.baseCurrency) setBaseCurrency(importedSettings.baseCurrency)
                if (importedSettings.targetCurrency) setTargetCurrency(importedSettings.targetCurrency)
                if (importedSettings.viewMode) setViewMode(importedSettings.viewMode)
                if (importedSettings.sortBy) setSortBy(importedSettings.sortBy)
                if (importedSettings.selectedBrand) setSelectedBrand(importedSettings.selectedBrand)
                if (importedSettings.selectedTags) setSelectedTags(importedSettings.selectedTags)
                if (importedSettings.activeCategoryView) setActiveCategoryView(importedSettings.activeCategoryView)
                if (importedSettings.searchTerm) setSearchTerm(importedSettings.searchTerm)
              }

              // Import UI state if available
              if (data.uiState) {
                if (data.uiState.comparisonItems) setComparisonItems(data.uiState.comparisonItems)
                if (data.uiState.exchangeRates) setExchangeRates(data.uiState.exchangeRates)
              }

              // Legacy support for older export formats
              if (!data.settings) {
                if (data.baseCurrency) setBaseCurrency(data.baseCurrency)
                if (data.targetCurrency) setTargetCurrency(data.targetCurrency)
              }

              const version = data.exportMetadata?.version || data.version || "Unknown"
              const itemCount = data.items?.length || 0
              const categoryCount = data.categories?.length || 0

              setNotification({
                type: "success",
                message: `Data imported successfully! (v${version}, ${itemCount} items, ${categoryCount} categories)`
              })

              // Reset file input
              e.target.value = ''

            } catch (error) {
              console.error("Import error:", error)
              setNotification({
                type: "error",
                message: "Error importing data: Invalid file format or corrupted data"
              })
            }
          }
          reader.readAsText(file)
        }

        // Measurement node functions
        const addMeasurementNode = (x, y) => {
          const newNode = {
            id: Date.now().toString(),
            x,
            y,
            label: `Point ${measurementNodes.length + 1}`,
          }
          setMeasurementNodes([...measurementNodes, newNode])
          setNotification({ type: "success", message: "Measurement node added!" })
        }

        const updateMeasurementNode = (nodeId, updates) => {
          setMeasurementNodes((prev) => prev.map((node) => (node.id === nodeId ? { ...node, ...updates } : node)))
        }

        const handleEditNodeLabel = (nodeId) => {
          const node = measurementNodes.find((n) => n.id === nodeId)
          if (node) {
            setEditingNode(nodeId)
            setEditingNodeLabel(node.label)
            setShowEditNodeModal(true)
          }
        }

        const saveNodeLabel = () => {

        const handleMeasurementCanvasClick = (e) => {
          if (draggedNode || !measurementEditMode) return

          const rect = e.currentTarget.getBoundingClientRect()
          const x = ((e.clientX - rect.left) / rect.width) * 100
          const y = ((e.clientY - rect.top) / rect.height) * 100

          addMeasurementNode(x, y)
        }

        const handleNodeMouseDown = (e, nodeId) => {
          if (!measurementEditMode) return

          e.stopPropagation()

          const canvas = document.querySelector(".measurement-canvas")
          const rect = canvas.getBoundingClientRect()
          const node = measurementNodes.find((n) => n.id === nodeId)
          const offsetX = e.clientX - rect.left - (node.x / 100) * rect.width
          const offsetY = e.clientY - rect.top - (node.y / 100) * rect.height

          setDraggedNode(nodeId)
          setDragOffset({ x: offsetX, y: offsetY })
        }

              const rect = canvas.getBoundingClientRect()
              const x = ((e.clientX - rect.left - dragOffset.x) / rect.width) * 100
              const y = ((e.clientY - rect.top - dragOffset.y) / rect.height) * 100

              updateMeasurementNode(draggedNode, {
                x: Math.max(0, Math.min(100, x)),
                y: Math.max(0, Math.min(100, y)),
              })
            }
          }

          const onUp = () => setDraggedNode(null)

          document.addEventListener("mousemove", onMove)
          document.addEventListener("mouseup", onUp)

          // Height conversions
          if (measurementType === 'height') {
            if (fromUnit === 'cm' && toUnit === 'ft') {
              const totalInches = value / 2.54
              const feet = Math.floor(totalInches / 12)
              const inches = totalInches % 12
              return parseFloat(`${feet}.${Math.round(inches).toString().padStart(2, '0')}`)
            }
            if (fromUnit === 'ft' && toUnit === 'cm') {
              const feet = Math.floor(value)
              const inches = (value - feet) * 100 / 100 * 12
              return Math.round((feet * 12 + inches) * 2.54)
            }
          }

          // Weight conversions
          if (measurementType === 'weight') {
            if (fromUnit === 'kg' && toUnit === 'lbs') {
              return Math.round(value * 2.20462 * 10) / 10
            }
            if (fromUnit === 'lbs' && toUnit === 'kg') {
              return Math.round(value / 2.20462 * 10) / 10
            }
          }

          // Shoe size conversions (approximate)
          if (measurementType === 'shoeSize') {
            if (fromUnit === 'EU' && toUnit === 'US') {
              return Math.round((value - 33) * 10) / 10
            }
            if (fromUnit === 'US' && toUnit === 'EU') {
              return Math.round(value + 33)
            }
            if (fromUnit === 'EU' && toUnit === 'UK') {
              return Math.round((value - 33.5) * 10) / 10
            }
            if (fromUnit === 'UK' && toUnit === 'EU') {
              return Math.round(value + 33.5)
            }
            if (fromUnit === 'US' && toUnit === 'UK') {
              return Math.round((value - 0.5) * 10) / 10
            }
            if (fromUnit === 'UK' && toUnit === 'US') {
              return Math.round((value + 0.5) * 10) / 10
            }
          }

          // Length conversions (for all other measurements)
          if (fromUnit === 'cm' && toUnit === 'in') {
            return Math.round(value / 2.54 * 10) / 10
          }
          if (fromUnit === 'in' && toUnit === 'cm') {
            return Math.round(value * 2.54 * 10) / 10
          }

                  {/* Modal Content */}
                  <div className="p-6 overflow-y-auto max-h-[calc(95vh-120px)]">
                    <div className={`grid gap-6 ${
                      comparisonItems.length === 1 ? 'grid-cols-1 max-w-md mx-auto' :
                      comparisonItems.length === 2 ? 'grid-cols-1 md:grid-cols-2' :
                      comparisonItems.length === 3 ? 'grid-cols-1 md:grid-cols-2 lg:grid-cols-3' :
                      'grid-cols-1 md:grid-cols-2 lg:grid-cols-4'
                    }`}>
                      {comparisonItems.map((item, index) => {
                        const conditionInfo = itemConditions.find(c => c.id === (item.condition || 'new'))

                        return (
                          <div key={item.id} className={`rounded-lg border-2 p-4 relative transition-all hover:shadow-lg ${
                            darkMode ? 'border-gray-600 bg-gray-700' : 'border-gray-200 bg-white'
                          }`}>
                            {/* Remove Button */}
                            <button
                              onClick={() => removeFromComparison(item.id)}
                              className="absolute top-3 right-3 rounded-full bg-red-500 text-white hover:bg-red-600 transition-all transform hover:scale-110 z-10"
                              title="Remove from comparison">
                              <i className="fas fa-times text-xs px-2 p-1"></i>
                            </button>

                            {/* Item Image */}
                            <div className="w-full h-40 bg-gray-100 rounded-lg mb-4 overflow-hidden relative group">
                              {item.imageUrl ? (
                                <img
                                  src={item.imageUrl}
                                  alt={item.name}
                                  className="w-full h-full object-cover object-center transition-transform group-hover:scale-105"
                                />
                              ) : (
                                <div className={`w-full h-full flex items-center justify-center ${
                                  darkMode ? 'bg-gray-600 text-gray-400' : 'bg-gray-100 text-gray-400'
                                }`}>
                                  <i className="fas fa-image text-3xl opacity-50"></i>
                                </div>
                              )}
                              {item.link && (
                                <div className="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                  <a
                                    href={item.link}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="bg-white bg-opacity-95 hover:bg-opacity-100 text-gray-800 p-2 rounded-full transition-all"
                                    title="Open in new tab">
                                    <i className="fas fa-external-link-alt text-sm"></i>
                                  </a>
                                </div>
                              )}
                            </div>

                            {/* Item Details */}
                            <div className="space-y-4">
                              <div>
                                <h4 className={`font-bold text-lg leading-tight ${darkMode ? 'text-white' : 'text-gray-800'}`}>
                                  {item.name}
                                </h4>
                                {item.brand && (
                                  <p className={`text-sm font-medium mt-1 ${darkMode ? 'text-blue-400' : 'text-blue-600'}`}>
                                    <i className="fas fa-building mr-1"></i>
                                    {item.brand}
                                  </p>
                                )}
                              </div>

                              {/* Comparison Table */}
                              <div className="space-y-3">
                                <div className="flex items-center justify-between py-2 border-b border-gray-200 dark:border-gray-600">
                                  <span className={`text-sm font-medium ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>Price:</span>
                                  <span className={`font-bold ${darkMode ? 'text-green-400' : 'text-green-600'}`}>
                                    {item.price
                                      ? formatCurrency(convertPrice(parseFloat(item.price), item.currency), targetCurrency)
                                      : (
                                        <span className={darkMode ? 'text-gray-400' : 'text-gray-500'}>Not set</span>
                                      )
                                    }
                                  </span>
                                </div>

                                <div className="flex items-center justify-between py-2 border-b border-gray-200 dark:border-gray-600">
                                  <span className={`text-sm font-medium ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>Condition:</span>
                                  <span className={`flex items-center space-x-1.5 ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>
                                    <i className={`${conditionInfo?.icon || 'fas fa-star'} text-xs`}></i>
                                    <span className="text-sm font-medium">{conditionInfo?.name || 'New'}</span>
                                  </span>
                                </div>

                                <div className="flex items-center justify-between py-2 border-b border-gray-200 dark:border-gray-600">
                                  <span className={`text-sm font-medium ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>Category:</span>
                                  <span className={`flex items-center space-x-1.5 ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>
                                    <i className={`fas fa-${categories.find((c) => c.id === item.category)?.icon || 'tag'} text-xs`}></i>
                                    <span className="text-sm font-medium">{categories.find((c) => c.id === item.category)?.name || "Other"}</span>
                                  </span>
                                </div>

                                {/* Tags */}
                                {item.tags && item.tags.length > 0 && (
                                  <div className="py-2">
                                    <span className={`text-sm font-medium block mb-2 ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>Tags:</span>
                                    <div className="flex flex-wrap gap-1">
                                      {item.tags.slice(0, 4).map(tag => (
                                        <span
                                          key={tag}
                                          className={`px-2 py-1 text-xs rounded-full font-medium ${
                                            darkMode ? 'bg-gray-600 text-gray-300' : 'bg-gray-100 text-gray-700'
                                          }`}>
                                          #{tag}
                                        </span>
                                      ))}
                                      {item.tags.length > 4 && (
                                        <span className={`text-xs px-2 py-1 rounded-full ${
                                          darkMode ? 'text-gray-400 bg-gray-600' : 'text-gray-500 bg-gray-100'
                                        }`}>
                                          +{item.tags.length - 4}
                                        </span>
                                      )}
                                    </div>
                                  </div>
                                )}

                                {/* Notes */}
                                {item.notes && (
                                  <div className="py-2">
                                    <span className={`text-sm font-medium block mb-2 ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>Notes:</span>
                                    <p className={`text-sm line-clamp-3 ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                                      {item.notes}
                                    </p>
                                  </div>
                                )}
                              </div>

                              {/* Action Buttons */}
                              <div className="flex space-x-2 pt-2">
                                <button
                                  onClick={() => {
                                    handleEdit(item.id)
                                    setShowComparison(false)
                                  }}
                                  className="flex-1 px-3 py-2 text-sm bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors">
                                  <i className="fas fa-edit mr-1"></i>
                                  Edit
                                </button>
                                {item.link && (
                                  <a
                                    href={item.link}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="flex-1 px-3 py-2 text-sm bg-green-500 text-white rounded-md hover:bg-green-600 transition-colors text-center">
                                    <i className="fas fa-external-link-alt mr-1"></i>
                                    Visit
                                  </a>
                                )}
                              </div>
                            </div>
                          </div>
                        )
                      })}
                    </div>

                    {/* Add More Items Prompt */}
                    {comparisonItems.length < 4 && (
                      <div className={`mt-6 p-4 rounded-lg border-2 border-dashed text-center ${
                        darkMode ? 'border-gray-600 bg-gray-700' : 'border-gray-300 bg-gray-50'
                      }`}>
                        <i className={`fas fa-plus text-2xl mb-2 ${darkMode ? 'text-gray-400' : 'text-gray-400'}`}></i>
                        <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                          You can compare up to 4 items. Add more items from your wishlist using the compare button.
                        </p>
                        <button
                          onClick={() => setShowComparison(false)}
                          className="mt-2 px-4 py-2 text-sm bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors">
                          Browse Items
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        )
      }

      const root = createRoot(document.getElementById("root"))
      root.render(<App />)
    </script>
  </body>
</html>
