<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; color: #fff; overflow: hidden; }
canvas { border: 1px solid #333; }
#ui { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 40px; font-size: 14px; color: #aaa; letter-spacing: 2px; }
#overlay { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 16px; }
#overlay h1 { font-size: 3rem; color: #fff; letter-spacing: 8px; text-shadow: 0 0 20px #fff; }
#overlay p { color: #aaa; letter-spacing: 2px; }
button { background: transparent; border: 1px solid #fff; color: #fff; padding: 10px 30px; font-family: 'Courier New', monospace; font-size: 1rem; letter-spacing: 3px; cursor: pointer; }
button:hover { background: #fff; color: #000; }
</style>
</head>
<body>
<div id="ui"><span>SCORE: <span id="score">0</span></span><span>LIVES: <span id="lives">3</span></span><span>LEVEL: <span id="level">1</span></span></div>
<canvas id="c"></canvas>
<div id="overlay">
  <h1>ASTEROIDS</h1>
  <p>ARROW KEYS / WASD TO MOVE &bull; SPACE TO SHOOT</p>
  <button id="startBtn">LAUNCH</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = Math.min(800, window.innerWidth - 20);
canvas.height = Math.min(600, window.innerHeight - 60);
const W = canvas.width, H = canvas.height;

let score = 0, lives = 3, level = 1, running = false;
let ship, bullets, asteroids, particles, invincible = 0;
const keys = {};

document.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
document.addEventListener('keyup', e => keys[e.code] = false);

document.getElementById('startBtn').onclick = startGame;

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  score = 0; lives = 3; level = 1; running = true;
  initLevel();
  loop();
}

function initLevel() {
  ship = { x: W/2, y: H/2, vx: 0, vy: 0, angle: 0, r: 14 };
  bullets = [];
  particles = [];
  asteroids = [];
  invincible = 180;
  for (let i = 0; i < 3 + level; i++) spawnAsteroid(null, 3);
  updateUI();
}

function spawnAsteroid(from, size) {
  let x, y;
  if (from) { x = from.x; y = from.y; }
  else {
    do { x = Math.random() * W; y = Math.random() * H; }
    while (Math.hypot(x - W/2, y - H/2) < 120);
  }
  const radii = [0, 14, 26, 46];
  asteroids.push({
    x, y,
    vx: (Math.random() - 0.5) * (4 - size) * 1.2,
    vy: (Math.random() - 0.5) * (4 - size) * 1.2,
    angle: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.05,
    r: radii[size], size,
    verts: Array.from({length: 10}, (_, i) => {
      const a = (i / 10) * Math.PI * 2;
      return { a, d: 0.7 + Math.random() * 0.3 };
    })
  });
}

function spawnParticles(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 3 + 1;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 60, col: col || '#fff' });
  }
}

let bulletTimer = 0;
function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  update();
  draw();
}

function update() {
  if (invincible > 0) invincible--;
  bulletTimer = Math.max(0, bulletTimer - 1);

  // Ship controls
  if (keys['ArrowLeft'] || keys['KeyA']) ship.angle -= 0.05;
  if (keys['ArrowRight'] || keys['KeyD']) ship.angle += 0.05;
  if (keys['ArrowUp'] || keys['KeyW']) {
    ship.vx += Math.sin(ship.angle) * 0.2;
    ship.vy -= Math.cos(ship.angle) * 0.2;
    spawnParticles(ship.x - Math.sin(ship.angle)*20, ship.y + Math.cos(ship.angle)*20, 1, '#f80');
  }
  if ((keys['Space']) && bulletTimer === 0) {
    bullets.push({ x: ship.x + Math.sin(ship.angle)*20, y: ship.y - Math.cos(ship.angle)*20, vx: Math.sin(ship.angle)*10, vy: -Math.cos(ship.angle)*10, life: 50 });
    bulletTimer = 12;
  }

  ship.vx *= 0.99; ship.vy *= 0.99;
  ship.vx = Math.max(-8, Math.min(8, ship.vx));
  ship.vy = Math.max(-8, Math.min(8, ship.vy));
  ship.x = (ship.x + ship.vx + W) % W;
  ship.y = (ship.y + ship.vy + H) % H;

  bullets = bullets.filter(b => {
    b.x = (b.x + b.vx + W) % W; b.y = (b.y + b.vy + H) % H; b.life--;
    return b.life > 0;
  });

  asteroids.forEach(a => {
    a.x = (a.x + a.vx + W) % W; a.y = (a.y + a.vy + H) % H; a.angle += a.spin;
  });

  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.life--; p.vx *= 0.97; p.vy *= 0.97;
    return p.life > 0;
  });

  // Bullet-asteroid collision
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    for (let ai = asteroids.length - 1; ai >= 0; ai--) {
      const b = bullets[bi], a = asteroids[ai];
      if (Math.hypot(b.x - a.x, b.y - a.y) < a.r) {
        spawnParticles(a.x, a.y, a.size * 5);
        const pts = [0, 10, 30, 100];
        score += pts[a.size]; updateUI();
        if (a.size > 1) { spawnAsteroid(a, a.size - 1); spawnAsteroid(a, a.size - 1); }
        asteroids.splice(ai, 1);
        bullets.splice(bi, 1);
        break;
      }
    }
  }

  // Ship-asteroid collision
  if (invincible === 0) {
    for (let a of asteroids) {
      if (Math.hypot(ship.x - a.x, ship.y - a.y) < a.r + ship.r) {
        spawnParticles(ship.x, ship.y, 20, '#f44');
        lives--; updateUI();
        if (lives <= 0) { gameOver(); return; }
        ship.x = W/2; ship.y = H/2; ship.vx = 0; ship.vy = 0;
        invincible = 180;
        break;
      }
    }
  }

  if (asteroids.length === 0) { level++; initLevel(); }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life / 60;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
  });
  ctx.globalAlpha = 1;

  // Asteroids
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1.5;
  asteroids.forEach(a => {
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.angle);
    ctx.beginPath();
    a.verts.forEach((v, i) => {
      const x = Math.cos(v.a) * a.r * v.d;
      const y = Math.sin(v.a) * a.r * v.d;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath(); ctx.stroke();
    ctx.restore();
  });

  // Bullets
  ctx.fillStyle = '#ff0';
  bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, Math.PI*2); ctx.fill(); });

  // Ship
  if (invincible === 0 || Math.floor(invincible / 8) % 2 === 0) {
    ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.angle);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(12, 14); ctx.lineTo(0, 8); ctx.lineTo(-12, 14); ctx.closePath(); ctx.stroke();
    ctx.restore();
  }
}

function gameOver() {
  running = false;
  const ov = document.getElementById('overlay');
  ov.innerHTML = `<h1>GAME OVER</h1><p>SCORE: ${score}</p><button onclick="location.reload()">PLAY AGAIN</button>`;
  ov.style.display = 'flex';
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('level').textContent = level;
}
</script>
</body>
</html>
