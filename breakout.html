<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Breakout</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0f; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; overflow:hidden; }
canvas { display:block; cursor:none; }
#hud { display:flex; gap:40px; margin-bottom:10px; font-size:13px; color:#666; letter-spacing:2px; }
#overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
#overlay h1 { font-size:2.8rem; letter-spacing:8px; color:#fff; text-shadow:0 0 30px #44f; }
#overlay p { color:#666; letter-spacing:2px; font-size:0.85rem; }
button { background:transparent; border:1px solid #44f; color:#44f; padding:10px 30px; font-family:'Courier New',monospace; font-size:0.9rem; letter-spacing:3px; cursor:pointer; }
button:hover { background:#44f; color:#fff; }
</style>
</head>
<body>
<div id="hud"><span>SCORE: <span id="score">0</span></span><span>LIVES: <span id="lives">3</span></span><span>LEVEL: <span id="level">1</span></span></div>
<canvas id="c"></canvas>
<div id="overlay">
  <h1>BREAKOUT</h1>
  <p>MOVE MOUSE TO CONTROL PADDLE</p>
  <button id="startBtn">PLAY</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 480; canvas.height = 520;
const W = canvas.width, H = canvas.height;

const COLS = 10, ROWS = 6, BW = 42, BH = 14, BPAD = 4;
const BOFF_X = (W - (COLS * (BW+BPAD) - BPAD)) / 2;
const BOFF_Y = 50;

const COLORS = ['#f44','#f84','#ff4','#4f4','#44f','#a4f'];
let score, lives, level, bricks, ball, paddle, running, particles;

document.getElementById('startBtn').onclick = startGame;
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  if (running) paddle.x = Math.max(paddle.w/2, Math.min(W - paddle.w/2, mx));
});
canvas.addEventListener('click', () => {
  if (running && !ball.active) ball.active = true;
});

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  score = 0; lives = 3; level = 1; running = true;
  initLevel(); requestAnimationFrame(loop);
}

function initLevel() {
  paddle = { x: W/2, y: H - 30, w: 80, h: 12 };
  ball = { x: W/2, y: H - 50, vx: 3 + level*0.3, vy: -(4 + level*0.3), r: 7, active: false };
  particles = [];
  bricks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const hp = r < 2 ? 2 : 1;
      bricks.push({ x: BOFF_X + c*(BW+BPAD), y: BOFF_Y + r*(BH+BPAD), w: BW, h: BH, hp, maxHp: hp, color: COLORS[r % COLORS.length], alive: true });
    }
  updateUI();
}

function spawnParticles(x, y, color, n=8) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, s = Math.random()*4+1;
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:40, col:color });
  }
}

function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  update(); draw();
}

function update() {
  particles = particles.filter(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life--; return p.life>0; });

  if (!ball.active) { ball.x = paddle.x; return; }

  ball.x += ball.vx; ball.y += ball.vy;

  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; }
  if (ball.x + ball.r > W) { ball.x = W-ball.r; ball.vx *= -1; }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }

  if (ball.y + ball.r > H + 20) {
    lives--; updateUI();
    if (lives <= 0) { endGame(); return; }
    ball.active = false; ball.x = paddle.x; ball.y = paddle.y - 20;
  }

  // Paddle collision
  if (ball.y + ball.r > paddle.y && ball.y - ball.r < paddle.y + paddle.h && ball.x > paddle.x - paddle.w/2 && ball.x < paddle.x + paddle.w/2) {
    ball.vy = -Math.abs(ball.vy);
    const offset = (ball.x - paddle.x) / (paddle.w/2);
    ball.vx = offset * 5;
  }

  // Brick collision
  for (let b of bricks) {
    if (!b.alive) continue;
    if (ball.x+ball.r > b.x && ball.x-ball.r < b.x+b.w && ball.y+ball.r > b.y && ball.y-ball.r < b.y+b.h) {
      b.hp--;
      if (b.hp <= 0) { b.alive = false; score += 10 * level; updateUI(); spawnParticles(b.x+b.w/2, b.y+b.h/2, b.color); }
      else spawnParticles(b.x+b.w/2, b.y+b.h/2, '#fff', 4);
      const overlapL = ball.x+ball.r - b.x, overlapR = b.x+b.w - (ball.x-ball.r);
      const overlapT = ball.y+ball.r - b.y, overlapB = b.y+b.h - (ball.y-ball.r);
      const minH = Math.min(overlapL, overlapR), minV = Math.min(overlapT, overlapB);
      if (minH < minV) ball.vx *= -1; else ball.vy *= -1;
      break;
    }
  }

  if (bricks.every(b => !b.alive)) { level++; initLevel(); }
}

function draw() {
  ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0,0,W,H);

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life/40;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
  });
  ctx.globalAlpha = 1;

  // Bricks
  bricks.forEach(b => {
    if (!b.alive) return;
    const alpha = b.hp / b.maxHp;
    ctx.fillStyle = b.color;
    ctx.globalAlpha = 0.3 + alpha*0.7;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x+0.5, b.y+0.5, b.w-1, b.h-1);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(b.x+1, b.y+1, b.w-2, 3);
  });

  // Paddle
  const grad = ctx.createLinearGradient(paddle.x-paddle.w/2, 0, paddle.x+paddle.w/2, 0);
  grad.addColorStop(0,'#226'); grad.addColorStop(0.5,'#66f'); grad.addColorStop(1,'#226');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.roundRect(paddle.x-paddle.w/2, paddle.y, paddle.w, paddle.h, 6); ctx.fill();

  // Ball
  const bg = ctx.createRadialGradient(ball.x-2, ball.y-2, 1, ball.x, ball.y, ball.r);
  bg.addColorStop(0,'#fff'); bg.addColorStop(1,'#88f');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

  if (!ball.active) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '12px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('CLICK TO LAUNCH', W/2, H - 10);
  }
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('level').textContent = level;
}

function endGame() {
  running = false;
  const ov = document.getElementById('overlay');
  ov.innerHTML = `<h1>GAME OVER</h1><p>SCORE: ${score}</p><button onclick="location.reload()">RETRY</button>`;
  ov.style.display = 'flex';
}
</script>
</body>
</html>
