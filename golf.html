    margin-top: 3px;
}

    0% {
        transform: translate(0, -5px);
    }
    25% {
        transform: translate(0, 0px);
    }
    50% {
        transform: translate(0, -5px);
    }
    75% {
        transform: translate(0, -15px);
    }
    100% {
        transform: translate(0, -5px);
    }

}

  <script>const canvas = document.getElementById("canvas"),
    ctx = canvas.getContext("2d");

const message = document.getElementById("message");
const messageText = document.getElementById("text");
const startBtn = document.getElementById("startBtn");
const campainBtn = document.getElementById("campainBtn");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

//animation stuff
let animationFrame = 0;
let animationDelay = true;
let animationRunning = true;

class Finish {
    constructor(x, y, r) {
        this.position = {
            x,
            y
        }
        this.radius = r;
        this.position.x = Math.round(this.position.x/tileSnap) * tileSnap; //snap x to grid
        this.position.y = Math.round(this.position.y/tileSnap) * tileSnap; //snap y to grid
    }
    draw() {
        //ctx.fillStyle = "black";
        //ctx.beginPath();
        //ctx.arc(this.position.x - this.radius, this.position.y - this.radius, this.radius, 0, Math.PI* 2);
        //ctx.fill();
        //ctx.closePath();
        ctx.drawImage(holeImage, this.position.x - this.radius, this.position.y - this.radius, this.radius * 2, this.radius * 2);
    }
    collision() {
        let dx = (this.position.x - this.radius) - (ball.position.x - ball.radius),
            dy = (this.position.y - this.radius) - (ball.position.y - ball.radius),
            d = Math.sqrt(dx * dx + dy * dy);
        if (d < this.radius-5) {
            if (animationRunning == false) {
                softWallHitSound.play();
                if (isCampain == false) {
                    nextLevel();
                    ball.visible = false;
                } else {
                    nextCampainLevel();
                    ball.visible = false;
                }
            }
        }
    }
    collidingWithTile() {
        solidTiles.forEach((tile) => {
            if (tile.position.x == this.position.x && this.position.y == tile.position.y) return true;
        })
        return false;
    }
    update() {
        this.draw();
        this.collision();
    }
}
class Tile {
    constructor(x, y, w, h) {
        this.position = {
            x,
            y
        };
        this.width = w;
        this.height = h;
        this.rotation = 0;
        this.hardSound = 5;
        this.position.x = Math.floor(this.position.x/tileSnap) * tileSnap;
        this.position.y = Math.floor(this.position.y/tileSnap) * tileSnap;
        for(let i = 0; i < 3; i++) {
            if (Math.random() < 0.5) {
                this.rotation += Math.PI/2;
            }
        }
    }
    draw() {
        ctx.save();
        ctx.translate(this.position.x + this.width/2, this.position.y + this.height/2);
        ctx.rotate(this.rotation);
        ctx.translate(-(this.position.x + this.width/2), -(this.position.y + this.height/2));
        ctx.drawImage(borderImage, this.position.x, this.position.y, this.width, this.height);
        ctx.restore();
    }
    collide(player) {
        if ( //left tile collision
            player.position.x + player.width > this.position.x &&
            player.position.x + player.velocity.x < this.position.x + this.width &&
            player.position.y + player.height > this.position.y &&
            player.position.y < this.position.y + this.height
        ) {
            player.velocity.x = -Math.abs(player.velocity.x);
            this.playSound(player);
        }
        if ( //right edge collision
            player.position.x + player.width + player.velocity.x > this.position.x &&
            player.position.x < this.position.x + this.width &&
            player.position.y + player.height > this.position.y &&
            player.position.y < this.position.y + this.height
        ) {
            player.velocity.x = Math.abs(player.velocity.x);
            this.playSound(player);
        }
        if ( //top edge collision
            player.position.x + player.width > this.position.x &&
            player.position.x < this.position.x + this.width &&
            player.position.y + player.height + player.velocity.y > this.position.y &&
            player.position.y < this.position.y + this.height
        ) {
            player.velocity.y = -Math.abs(player.velocity.y);
            this.playSound(player);
        }
        if ( //bottom edge collision
            player.position.x + player.width > this.position.x &&
            player.position.x < this.position.x + this.width &&
            player.position.y + player.height > this.position.y &&
            player.position.y + player.velocity.y < this.position.y + this.height
        ) {
            player.velocity.y = Math.abs(player.velocity.y);
            this.playSound(player);
        }
    }
    playSound(player) {
            if (player.isGhost == false) {
            let velocity = player.velocity.x + player.velocity.y;
            if (velocity > this.hardSound) hardWallHitSound.play();
            else softWallHitSound.play();
        }
    }
}
class DenseGrass {
    constructor(x, y, w, h) {
        this.position = {
            x,
            y
        }
        this.width = w;
        this.height = h;
        this.denseness = 0.92;
        this.position.x = Math.floor(this.position.x/tileSnap) * tileSnap;
        this.position.y = Math.floor(this.position.y/tileSnap) * tileSnap;
    }
    draw() {
        ctx.drawImage(denseGrassImage, this.position.x, this.position.y, this.width, this.height);
    }
    collide(player) {
        if ( //left tile collision
            player.position.x + player.width + player.velocity.x > this.position.x &&
            player.position.x + player.velocity.x < this.position.x + this.width &&
            player.position.y + player.height + player.velocity.y > this.position.y &&
            player.position.y + player.velocity.y < this.position.y + this.height
        ) {
            player.velocity.x *= this.denseness;
            player.velocity.y *= this.denseness;
        }
    }
}
class Dirt {
    constructor(x, y, w, h) {
        this.position = {
            x,
            y
        }
        this.width = w;
        this.height = h;
        this.position.x = Math.floor(this.position.x/tileSnap) * tileSnap;
        this.position.y = Math.floor(this.position.y/tileSnap) * tileSnap;
    }
    draw() {
        ctx.save();
        ctx.translate(this.position.x + this.width/2, this.position.y + this.height/2);
        ctx.rotate(this.rotation);
        ctx.translate(-(this.position.x + this.width/2), -(this.position.y + this.height/2));
        ctx.drawImage(dirtImage, this.position.x, this.position.y, this.width, this.height);
        ctx.restore();
    }
}
class Portal {
    constructor(x, y, w, h) {
        this.position = {
            x,
            y
        }
        this.position.x = Math.floor(this.position.x / tileSnap) * tileSnap;
        this.position.y = Math.floor(this.position.y / tileSnap) * tileSnap;
        this.width = w;
        this.height = h;
        this.radius = ((w + h) / 2)/2;
        this.other;
        this.id = genId(10);
    }
    draw() {
        ctx.drawImage(portalImage, this.position.x, this.position.y, this.width, this.height);
    }
    update() {
        this.draw();
        let dx = ball.position.x - this.position.x,
            dy = ball.position.y - this.position.y,
            d = Math.sqrt(dx * dx + dy * dy);

        if (!this.other) {
            this.chooseDest();
        }
        
        if (d < this.radius && this.other) {
            ball.visible = false;
            let angle = Math.atan2(ball.velocity.y, ball.velocity.x);
            ball.position.x = this.other.position.x + this.width/2;
            ball.position.y = this.other.position.y + this.height/2;
            setTimeout(function() {
                //teleportation
                ball.visible = true;
            },50);
        }
    }
    chooseDest() {
        this.other = portals[Math.floor(Math.random() * portals.length)];
            
        while(this.other.id === this.id) {
            let dest = portals[Math.floor(Math.random() * portals.length)];
            this.other = dest;
        }
    }
}
class Ball {
    constructor(x, y, r) {
        this.position = {
            x,
            y
        }
        this.velocity = {
            x: 0,
            y: 0
        }
        this.isGhost = false;
        this.ghost = {
            position: {
                x,
                y
            },
            velocity: {
                x: 0,
                y: 0
            },
            friction: 0.95,
            pullPower: 6,
            delay: 0,
            maxDelay: 50,
            prevAngle: 0,
            visible: true,
            width: r * 2,
            height: r * 2,
            isGhost: true
        }
        this.radius = r;
        this.width = r * 2;
        this.height = 2 * r;
        this.pullPower = 6;
        this.friction = 0.95;
        this.maxSpeed = 50;
        this.visibe = true;
    }
    draw() {
        if (this.visible == false) return;

        //player
        let angle = Math.atan2(this.velocity.y, this.velocity.x);
        ctx.save();
        ctx.translate(this.position.x + this.radius, this.position.y + this.radius);
        ctx.rotate(angle);
        ctx.translate(-(this.position.x + this.radius), -(this.position.y + this.radius));
        ctx.drawImage(ballImage, this.position.x, this.position.y, this.radius * 2, this.radius * 2);
        ctx.restore();

        if (mouse.down && this.ghost.visible) {
        //ghost
            ctx.strokeStyle = "rgba(0, 0, 0, 0.5)";
            ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(this.ghost.position.x, this.ghost.position.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.closePath();
        }
    }
    update() {
        this.draw();
        this.position.x += this.velocity.x;
        this.position.y += this.velocity.y;
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;

        
        if (mouse.down) {
            if (mouse.setPrivot) {
                //set the mouse privot only the first time
                mouse.privot.x = mouse.position.x;
                mouse.privot.y = mouse.position.y;
                mouse.setPrivot = false;
            }
            let dx = mouse.privot.x - mouse.position.x,
                dy = mouse.privot.y - mouse.position.y,
                d = Math.sqrt(dx * dx + dy * dy),
                angle = Math.atan2(dy, dx);
            
            //draw the line
            ctx.strokeStyle = "black";
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(mouse.position.x, mouse.position.y);
            ctx.lineTo(mouse.privot.x, mouse.privot.y);
            ctx.stroke();
            ctx.closePath();
        } else {
            //set velocity only the first time
            if (mouse.setPrivot == false && puttsLeft > 0) {
                let dx = mouse.privot.x - mouse.position.x,
                dy = mouse.privot.y - mouse.position.y,
                d = Math.sqrt(dx * dx + dy * dy),
                angle = Math.atan2(dy, dx);
                if (d > 3) {
                    hitSound.play();
                    putts++; //keep track how many times we've done this for
                    totalPutts++;
                    puttsLeft--;
                }
                this.velocity.x = Math.cos(angle) * this.pullPower * (d / 50);
                this.velocity.y = Math.sin(angle) * this.pullPower * (d / 50);
            }
            mouse.setPrivot = true;
        }

        this.velocity.x = clamp(this.velocity.x, -this.maxSpeed, this.maxSpeed);
        this.velocity.y = clamp(this.velocity.y, -this.maxSpeed, this.maxSpeed);
        this.borderBounce();
    }
    updateGhost() {
        this.ghost.position.x += this.ghost.velocity.x;
        this.ghost.position.y += this.ghost.velocity.y;
        this.ghost.velocity.x *= this.ghost.friction;
        this.ghost.velocity.y *= this.ghost.friction;

        let dx = mouse.privot.x - mouse.position.x,
        dy = mouse.privot.y - mouse.position.y,
        d = Math.sqrt(dx * dx + dy * dy),
        angle = Math.atan2(dy, dx);

        if (angle != this.ghost.prevAngle) {
            this.ghost.position.x = this.position.x;
            this.ghost.position.y = this.position.y;
            this.ghost.velocity.x = Math.cos(angle) * this.pullPower * (d / 50);
            this.ghost.velocity.y = Math.sin(angle) * this.pullPower * (d / 50);
        }

        if (this.ghost.velocity.x < 0.1 && this.ghost.velocity.y < 0.1) {
            this.ghost.visible = true;
        } else {
            this.ghost.visible = false;
        }
        
        this.ghost.prevAngle = angle;
    }
    borderBounce() {
        //player
        if (this.position.x + this.width + this.velocity.x > canvas.width) this.velocity.x = -Math.abs(this.velocity.x);
        if (this.position.x + this.velocity.x < 0) this.velocity.x = Math.abs(this.velocity.x);
        if (this.position.y + this.height + this.velocity.y > canvas.height) this.velocity.y = -Math.abs(this.velocity.y);
        if (this.position.y + this.velocity.y < 0) this.velocity.y = Math.abs(this.velocity.y);
        //ghost
        if (this.ghost.position.x + this.width + this.ghost.velocity.x > canvas.width) this.ghost.velocity.x = -Math.abs(this.ghost.velocity.x);
        if (this.ghost.position.x + this.ghost.velocity.x < 0) this.ghost.velocity.x = Math.abs(this.ghost.velocity.x);
        if (this.ghost.position.y + this.height + this.ghost.velocity.y > canvas.height) this.ghost.velocity.y = -Math.abs(this.ghost.velocity.y);
        if (this.ghost.position.y + this.ghost.velocity.y < 0) this.ghost.velocity.y = Math.abs(this.ghost.velocity.y);
    }
    colliding() {
        for(let i = 0; i < solidTiles.length; i++) {
            let tile = solidTiles[i];
            if (
                this.position.x < tile.position.x + tile.width &&
                this.position.y < tile.position.y + tile.height &&
                this.position.x + this.width > tile.position.x &&
                this.position.y + this.height > tile.position.y
            ) return true;
        }
        return false;
    }
}

let gameOver = false;
let ball = new Ball(100, 100, 20); //ball that you move around
let putts = 0; //total putts you have made in the level
let totalPutts = 0; //total putts you have made in the game
let puttsLeft = 10; //keep track of how much putts avaliable for the level
let tileSnap = 100; //the snap value for the tiles in the game
let finish = new Finish(Math.random() * canvas.width, Math.random() * canvas.height, tileSnap/2); //the finishing hole
let solidTiles = [new Tile(100, 100, 50, 50)]; //will contain all of the collidable tiles
let solidTilesAmount = 25; //how much tiles spawn in the round
let grassTilesAmount = 3; //the amount of dense grass spawning
let grassTiles = []; //dense grass tiles
let score = 0; //your score
let loseDelay = 0; //a delay for no putts
let dirt = new Dirt(ball.position.x, ball.position.y, tileSnap, tileSnap);
let campLevel = 0; //the level ur up to
let isCampain = false; //check is we are playing campain mode
let portals = []; //keep track of the portals in the game

if (!localStorage.getItem("best")) {
    localStorage.setItem("best", 0);
}
if (!localStorage.getItem("campBest")) {
    localStorage.setItem("campBest", 0);
}

const mouse = { //this has all of the data about the mouse: position, privot, clicking, ect.
    position: {
        x: canvas.width/2,
        y: canvas.height/2
    },
    privot: {
        x: canvas.width/2,
        y: canvas.height/2
    },
    setPrivot: false,
    down: false
}

function init() { //initialization function
    isCampain = false;
    reset();
    totalPutts = 0;
    score = 0;
    startAnimation();
}
function initCamp() {
    isCampain = true;
    puttsLeft = 10;
    putts = 0;
    score = 0;
    solidTiles = [];
    grassTiles = [];
    portals = [];

    if (levels[campLevel]) {
        let level = levels[campLevel];
        let cols = level[0].length,
            rows = level.length;
    
        for(let x = 0; x < cols; x++) {
            for(let y = 0; y < rows; y++) {
                if (level[y].charAt(x) == "b") {
                    solidTiles.push(new Tile(x * tileSnap, y * tileSnap, tileSnap, tileSnap));
                }
                if (level[y].charAt(x) == "o") {
                    dirt = new Dirt(x * tileSnap, y * tileSnap, tileSnap, tileSnap);
                    ball = new Ball(dirt.position.x + dirt.width/2 - 20, dirt.position.y + dirt.height/2 - 20, 20);
                }
                if (level[y].charAt(x) == "f") {
                    finish = new Finish(x * tileSnap, y * tileSnap, tileSnap/2);
                }
                if (level[y].charAt(x) == "g") {
                    grassTiles.push(new DenseGrass(x * tileSnap, y * tileSnap, tileSnap, tileSnap))
                }
                if (level[y].charAt(x) == "p") {
                    portals.push(new Portal(x * tileSnap, y * tileSnap, tileSnap, tileSnap));
                    if (portals[[portals.length-2]]) { //if there is a previous portal
                        portals[portals.length-1].other = portals[portals.length-2]; //set the current's other to prev
                        //portals[portals.length-2].other = portals[portals.length-1];
                    }
                }
            }
        }
    } else {
        messageText.innerText = "You win! Perhaps try the random levels."
        message.style.visibility = "visible";
        toMenu();
    }
}
function nextLevel() {
    levelUpAnimation();
    setTimeout(function() {
        score += puttsLeft;
        reset();
    },2000);
}
function nextCampainLevel() {
    levelUpAnimation();
    setTimeout(function() {
        score += puttsLeft;
        campLevel++;
        initCamp();
    },2000);
}
function reset() {
    puttsLeft = 10;
    putts = 0;
    portals = [];
    finish = new Finish(Math.random() * canvas.width, Math.random() * canvas.height, tileSnap/2);
    dirt = new Dirt(Math.random() * (canvas.width - 200) + 100, (Math.random()) * (canvas.height-200) + 100, tileSnap, tileSnap);
    ball = new Ball(dirt.position.x + dirt.width/2 - 20, dirt.position.y + dirt.height/2 - 20, 20);
    solidTiles = [];
    for(let i = 0; i < solidTilesAmount; i++) {
        solidTiles.push(new Tile(Math.random() * canvas.width, Math.random() * canvas.height, tileSnap, tileSnap))
    }
    for(let i = 0; i < grassTilesAmount; i++) {
        grassTiles.push(new DenseGrass(Math.random() * canvas.width, Math.random() * canvas.height, tileSnap, tileSnap))
    }
    solidTiles.forEach((solid, i) => {
        grassTiles.forEach((grass, x) => {
            if (solid.position.x == grass.position.x && solid.position.y == grass.position.y) {
                solidTiles.splice(i, 1);
                grassTiles.splice(x, 1);
            }
        })
    })
    //generate();
    while(finish.position.x < 0 || finish.position + finish.radius * 2 > canvas.width-100 || finish.position.y < 40 || finish.position.y + finish.radius * 2 > canvas.height) {
        finish.position.x = Math.floor((Math.random() * canvas.width)/tileSnap) * tileSnap;
        finish.position.y = Math.floor((Math.random() * canvas.height)/tileSnap) * tileSnap;
    }
    while(ball.colliding()) {
        dirt.position.x = Math.random() * (canvas.width - 200) + 100;
        dirt.position.y = Math.random() * (canvas.height - 200) + 100;
        dirt.position.x = Math.floor(dirt.position.x/tileSnap) * tileSnap;
        dirt.position.y = Math.floor(dirt.position.y/tileSnap) * tileSnap;
        ball.position = { x: dirt.position.x + dirt.width/2 - 20, y: dirt.position.y + dirt.height/2 - 20}
    }
};
function generate() {
    noiseSeed();
    for(let x = 0; x < canvas.width; x += tileSnap) {
        for(let y = 0; y < canvas.height; y+= tileSnap) {
            let value = noise(x/10, y/10) * 50;
            if (value > 30) {
                solidTiles.push(new Tile(x, y, tileSnap, tileSnap))
            } else if (value < 15) {
                grassTiles.push(new DenseGrass( x, y, tileSnap, tileSnap));
            }
        }
    }
}

function loop() { //gameloop nearly every game has this
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    solidTiles.forEach((tile) => {
        tile.collide(ball);
        tile.draw();
    })
    grassTiles.forEach((tile) => {
        tile.collide(ball);
        tile.draw();
    })
    portals.forEach((portal) => {
        portal.update();
    })
    dirt.draw();
    finish.update();
    ball.update();
    drawTitle();
    if (animationRunning) {
        animation();
    }
    if (puttsLeft == 0) {
        loseDelay++;
        if (loseDelay > 300) {
            loseDelay = 0;
            messageText.innerText = "You Lose!";
            message.style.visibility = "visible";
            
            if (isCampain) {
                startAnimation();
                initCamp();
            }
            else {
                init();
            }
        }
    }
    if (!gameOver) setTimeout(loop, 10);
}
function startGame() {
    gameOver = false;
    init();
    loop();
}
function startCampain() {
    gameOver = false;
    startAnimation();
    initCamp();
    loop();
}
document.querySelector(".backBtn").onclick = function() {toMenu();};
function toMenu() {
    document.getElementById('title').style.visibility = 'visible'; 
    gameOver = true;
    campLevel = 0;
    window.onmousedown = function(e) {};
    window.onmousemove = function(e) {};
    window.onmouseup = function(e) {};
    setTimeout(function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }, 100);
}
campainBtn.onclick = function() {
    this.parentElement.style.visibility = "hidden";
    window.onmousemove = function(e) {
        mouse.position.x = e.x;
        mouse.position.y = e.y;
    }
    window.onmousedown = function() {
        mouse.down = true;
    }
    window.onmouseup = function() {
        mouse.down = false;
    }
    startCampain();
}
startBtn.onclick = function() {
    this.parentElement.style.visibility = "hidden";
    window.onmousemove = function(e) {
        mouse.position.x = e.x;
        mouse.position.y = e.y;
    }
    window.onmousedown = function() {
        mouse.down = true;
    }
    window.onmouseup = function() {
        mouse.down = false;
    }
    startGame();
}

window.onresize = function() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
function clamp(x, min, max) {
    if (x < min) x = min;
    if (x > max) x = max;
    return x;
}
function drawTitle() {
    ctx.fillStyle = "black";
    ctx.font = "30px Pacifico";
    if (isCampain == false) {
        if (localStorage.getItem("best") < score) {
            localStorage.setItem("best", score);
        }
        ctx.fillText("Putts Made: " + putts + " Putts Left: " + puttsLeft + "    Score: " + score + " Best: " + localStorage.getItem("best"), 10, 40);
    } else {
        if (localStorage.getItem("campBest") < score) {
            localStorage.setItem("campBest", score);
        }
        ctx.fillText("Putts Made: " + putts + " Putts Left: " + puttsLeft + "    Score: " + score + " Best: " + localStorage.getItem("campBest"), 10, 40);
    }
}
function animation() {
    animationDelay++;
    animationFrame+=0.01;
    ctx.fillStyle = "rgba(0, 0, 0, " + Math.sin(animationFrame) + ")";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (Math.sin(animationFrame) <= 0) {
        animationRunning = false;
    }
}
function startAnimation() {
    animationFrame = 1.5707;
    animationRunning = true;
}
function levelUpAnimation() {
    animationFrame = 0.1;
    animationRunning = true;
}
function ghostLoop() {
    ball.updateGhost();
    solidTiles.forEach((tile) => {
        tile.collide(ball.ghost);
    })
    grassTiles.forEach((tile) => {
        tile.collide(ball.ghost);
    })
    setTimeout(ghostLoop, 1);
}
ghostLoop();
ghostLoop();
ghostLoop();

function genId(length) {
    let id;
    let words = "1234567890-=qwertyuiop[]\asdfghjkl;'zxcvbnm,./'";
    for(let i = 0; i < length; i++) {
        id += words.charAt(Math.floor(Math.random() * words.length))
    }
    return id;
}
